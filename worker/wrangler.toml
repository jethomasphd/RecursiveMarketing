# Deploying from this directory is equivalent to deploying from the repo root
# (../wrangler.jsonc) — same Worker, same script. Prefer the repo root so the
# Cloudflare dashboard build (root directory = repo root) and a local
# `wrangler deploy` stay in agreement.
#
# This Worker is API-only (/chat, /health, /geo). The static site in ../public
# is served by the separate Cloudflare Pages project "recursive-marketing".
name = "recursive-marketing-worker"
main = "src/index.ts"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = ""
# CLAUDE_MODEL  = "claude-opus-5"   # optional override
# CLAUDE_EFFORT = "low"             # low | medium | high | xhigh | max | off

# Secrets — set via wrangler or Cloudflare Dashboard:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put USAJOBS_API_KEY
#   wrangler secret put USAJOBS_EMAIL
